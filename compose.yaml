name: openoj

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - edge

  web:
    build:
      context: ./frontend
    ports:
      # Local debugging only; public traffic goes through caddy on 80/443
      - "127.0.0.1:${OPENOJ_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
      - /var/run:size=1m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app
      - edge

  problems-fetcher:
    # One-shot: the only component allowed to reach github.com; fills the
    # problems_cache volume before the networkless API starts. No-op when
    # OPENOJ_PROBLEMS is unset or local.
    build:
      context: ./api
    entrypoint: ["python", "-m", "app.fetch_problems"]
    environment:
      OPENOJ_PROBLEMS: ${OPENOJ_PROBLEMS:-zydo/openoj-problems}
      OPENOJ_PROBLEMS_CACHE: /cache/problems
      HOME: /tmp
    volumes:
      - ${OPENOJ_PROBLEMS_CACHE_DIR:-./.cache}:/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - edge

  api:
    build:
      context: ./api
    depends_on:
      problems-fetcher:
        condition: service_completed_successfully
    environment:
      OPENOJ_PROBLEMS: ${OPENOJ_PROBLEMS:-zydo/openoj-problems}
      OPENOJ_PROBLEMS_CACHE: /cache/problems
      OPENOJ_PROBLEMS_DIR: /problems
      OPENOJ_DATA_DIR: /data
      OPENOJ_QUEUE_DIR: /queue
      OPENOJ_RUNNER_TIMEOUT_SECONDS: "20"
      # Writable home so git (used to fetch remote problem sets) can operate
      HOME: /tmp
    volumes:
      - "${OPENOJ_PROBLEMS_PATH:-./problems}:/problems:ro"
      - ${OPENOJ_PROBLEMS_CACHE_DIR:-./.cache}:/cache:ro
      - openoj_data:/data
      - judge_queue:/queue
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app

  runner:
    build:
      context: ./runner
    environment:
      OPENOJ_QUEUE_DIR: /queue
      OPENOJ_POLL_INTERVAL: "0.05"
    volumes:
      - judge_queue:/queue
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
      - /work:size=384m,mode=1777,exec
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETUID
      - SETGID
    group_add:
      - "10001"
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 64
    restart: unless-stopped

volumes:
  openoj_data:
  judge_queue:
  caddy_data:
  caddy_config:

networks:
  app:
    internal: true
  edge:
