name: Publish runner image

# Builds runner/ and pushes it to GHCR. This is the published home of
# the authoring toolchain (openoj format / gen-starters / judge — see
# docs/AUTHORING.md); a tag push publishes that version, and every
# merge to main refreshes :latest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['runner/**', '.github/workflows/publish-runner.yml']
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openoj
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: runner
          file: runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
