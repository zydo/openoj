name: Check fallback problems

# The offline fallback set bundled in this repo (openoj/problems/, used
# when OPENOJ_PROBLEMS is unset). Same image, same gates as the main
# problems repo: accidental edits to the fallback are caught here, on
# every push touching it. (problems-bettercode lives in the problems
# repo and is frozen; it is not covered by CI.)

on:
  push:
    branches: [main]
    paths: ['problems/**', '.github/workflows/check-fallback.yml']
  pull_request:
    paths: ['problems/**', '.github/workflows/check-fallback.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zydo/openoj:latest
      options: --user 0:0
    steps:
      - uses: actions/checkout@v5
      - name: Format check
        run: openoj format --check problems
      - name: Judge every bundle
        run: |
          set -e
          failures=0
          for bundle in problems/*/; do
            if ! openoj judge "$bundle"; then failures=$((failures + 1)); fi
          done
          echo "fallback bundles with failures: $failures"
          exit $((failures > 0))
